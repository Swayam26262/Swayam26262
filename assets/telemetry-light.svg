<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-labelledby="t d" fill="none"><title id="t">GitHub telemetry</title><desc id="d">GitHub telemetry</desc><style>@font-face{font-family:spdd;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:spdd,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}@font-face{font-family:spss;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:spss,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.odo{animation:odo 2.2s cubic-bezier(.12,.9,.22,1) both}
@keyframes odo{from{transform:translateY(0)}}

.rise{animation:rise .9s cubic-bezier(.2,.9,.25,1.15) both;transform-box:fill-box;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0)}}
.seg{animation:seg 1.1s cubic-bezier(.3,.8,.2,1) both;transform-box:fill-box;transform-origin:left}
@keyframes seg{from{transform:scaleX(0)}}
.fi{animation:fi .8s ease-out both}
@keyframes fi{from{opacity:0}}
.ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.best{animation:best 2.4s ease-in-out infinite}
@keyframes best{50%{transform:translateY(-3px)}}
</style><rect x=".5" y=".5" width="839" height="119" rx="16" fill="#fbfcff" stroke="#dfe5f2"/><text x="420" y="56" class="d" fill="#0f172a" font-size="18" text-anchor="middle">Telemetry is warming up</text><text x="420" y="80" class="s" fill="#475569" font-size="12.5" text-anchor="middle">The first run of the profile workflow fills this card with live GitHub data.</text></svg>
