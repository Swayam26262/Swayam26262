<svg xmlns="http://www.w3.org/2000/svg" width="112" height="48" viewBox="0 0 112 48" role="img" aria-labelledby="svg-title svg-desc" fill="none"><title id="svg-title">Resume</title><desc id="svg-desc">Resume: https://drive.google.com/file/d/1P1EvdPLFmHG16GUYRoAI6XvwXH_ZdRf8/view</desc><style>@font-face{font-family:spmm;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:spmm,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:spmmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:spmmb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rule{shape-rendering:crispEdges}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(105%)}}
.slide{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.lift{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{opacity:0;transform:translateY(8px)}}
.on{animation:on .1s steps(1,start) both}
@keyframes on{from{opacity:0}}
.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}

.nudge{animation:nudge 2.4s cubic-bezier(.7,0,.3,1) infinite}
@keyframes nudge{0%,60%,100%{transform:translate(0,0)}70%,90%{transform:translate(2px,-2px)}}
</style><rect x="8" y="8" width="104" height="40" fill="#ff5c26"/><rect x="0.5" y="0.5" width="103" height="39" fill="#121212" stroke="#eeeae2"/><text x="16" y="25" class="mb" fill="#eeeae2" font-size="11" letter-spacing="1.6">RESUME</text><g class="nudge"><text x="88" y="26" class="m" fill="#eeeae2" font-size="13" text-anchor="end">↗</text></g></svg>
