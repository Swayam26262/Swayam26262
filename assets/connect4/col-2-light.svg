<svg xmlns="http://www.w3.org/2000/svg" width="56" height="48" viewBox="0 0 56 48" role="img" aria-labelledby="svg-title svg-desc" fill="none"><title id="svg-title">Drop a disc in column 2</title><desc id="svg-desc">Drop a disc in column 2</desc><style>@font-face{font-family:spmmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:spmmb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rule{shape-rendering:crispEdges}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(105%)}}
.slide{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.lift{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{opacity:0;transform:translateY(8px)}}
.on{animation:on .1s steps(1,start) both}
@keyframes on{from{opacity:0}}
.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}

.bob{animation:bob 1.2s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
</style><rect x="0.5" y="0.5" width="55" height="47" fill="#f2eee6" stroke="#121212"/><text x="12" y="20" class="mb" fill="#46423c" font-size="10">2</text><g class="bob" style="animation-delay:0.1s"><rect x="20.0" y="18" width="16" height="16" fill="#ec4511"/><path d="M23.0 38l5 5 5-5" stroke="#121212" stroke-width="1.5" fill="none" stroke-linecap="square"/></g></svg>
