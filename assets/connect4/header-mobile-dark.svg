<svg xmlns="http://www.w3.org/2000/svg" width="408" height="200" viewBox="0 0 408 200" role="img" aria-labelledby="svg-title svg-desc" fill="none"><title id="svg-title">Play Connect Four against my AI</title><desc id="svg-desc">Everyone on GitHub plays one shared game of Connect Four against my AI.</desc><style>@font-face{font-family:spmm;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:spmm,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:spmmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:spmmb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}@font-face{font-family:spssi;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.si{font-family:spssi,'Iowan Old Style','Times New Roman',Georgia,serif;font-weight:400;font-style:italic}@font-face{font-family:spssr;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.sr{font-family:spssr,'Iowan Old Style','Times New Roman',Georgia,serif;font-weight:400}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rule{shape-rendering:crispEdges}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(105%)}}
.slide{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.lift{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{opacity:0;transform:translateY(8px)}}
.on{animation:on .1s steps(1,start) both}
@keyframes on{from{opacity:0}}
.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}
</style><rect x="8" y="8" width="400" height="192" fill="#ff5c26"/><rect x="0.5" y="0.5" width="399" height="191" fill="#121212" stroke="#eeeae2"/><text x="24" y="25" class="mb" fill="#ff5c26" font-size="10" letter-spacing="1">§08</text><text x="64" y="25" class="m" fill="#eeeae2" font-size="10" letter-spacing="1.6">PLAY</text><text x="376" y="25" class="m" fill="#c4beb3" font-size="10" text-anchor="end" letter-spacing="1.6">CONNECT FOUR</text><path d="M0 39.5H400" stroke="#eeeae2" stroke-width="1"/><text x="24" y="88" class="sr" fill="#eeeae2" font-size="36">One shared game.</text><text x="24" y="128" class="si" fill="#ff5c26" font-size="36">You vs. my AI.</text><text x="24" y="156" class="m" fill="#c4beb3" font-size="9" letter-spacing="1.2">PICK A COLUMN → PRESS CREATE ON THE ISSUE</text><text x="24" y="172" class="m" fill="#c4beb3" font-size="9" letter-spacing="1.2">THE AI REPLIES IN ABOUT A MINUTE</text></svg>
