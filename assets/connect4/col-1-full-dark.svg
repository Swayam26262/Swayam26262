<svg xmlns="http://www.w3.org/2000/svg" width="72" height="48" viewBox="0 0 72 48" role="img" aria-labelledby="svg-title svg-desc" fill="none"><title id="svg-title">Column 1 is full</title><desc id="svg-desc">Column 1 is full</desc><style>@font-face{font-family:spmmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:spmmb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rule{shape-rendering:crispEdges}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(105%)}}
.slide{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.lift{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{opacity:0;transform:translateY(8px)}}
.on{animation:on .1s steps(1,start) both}
@keyframes on{from{opacity:0}}
.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#eeeae2" stroke-width="1"/></pattern><pattern id="hatch-a" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#ff5c26" stroke-width="2"/></pattern><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="3.5" y="3.5" width="1" height="1" fill="#716c63"/></pattern></defs><rect x="16" y="0" width="56" height="48" fill="#121212"/><rect x="16" y="0" width="56" height="48" fill="url(#hatch)" opacity=".5"/><rect x="16.5" y="0.5" width="55" height="47" fill="none" stroke="#eeeae2"/><text x="44" y="29" class="mb" fill="#eeeae2" font-size="9" text-anchor="middle" letter-spacing="1.2">FULL</text></svg>
