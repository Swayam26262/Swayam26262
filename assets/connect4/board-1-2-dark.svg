<svg xmlns="http://www.w3.org/2000/svg" width="432" height="408" viewBox="0 0 432 408" role="img" aria-labelledby="svg-title svg-desc" fill="none"><title id="svg-title">Connect Four, game #1 (your move)</title><desc id="svg-desc">Board after 2 moves.</desc><style>@font-face{font-family:spmmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.mb{font-family:spmmb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}text{font-kerning:normal}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rule{shape-rendering:crispEdges}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(105%)}}
.slide{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.lift{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{opacity:0;transform:translateY(8px)}}
.on{animation:on .1s steps(1,start) both}
@keyframes on{from{opacity:0}}
.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}

.drop{animation:drop .7s cubic-bezier(.5,0,.75,0) both}
@keyframes drop{0%{transform:translateY(var(--from))}72%{transform:translateY(0)}84%{transform:translateY(-8px)}
94%{transform:translateY(0)}100%{transform:translateY(0)}}
.ring{animation:ring 1s steps(1,end) 2s infinite}
@keyframes ring{50%{opacity:0}}
.win{stroke-dasharray:1;animation:win .8s cubic-bezier(.7,0,.3,1) 1.6s both}
@keyframes win{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
