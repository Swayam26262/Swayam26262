.wipe{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes wipe{from{transform:scaleX(0)}}
.blip{animation:blip 1s steps(1,end) infinite}
@keyframes blip{50%{opacity:0}}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#121212" stroke-width="1"/></pattern><pattern id="hatch-a" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#ff4d1a" stroke-width="2"/></pattern><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="3.5" y="3.5" width="1" height="1" fill="#8a8478"/></pattern></defs><rect x="0" y="0" width="56" height="48" fill="#f2eee6"/><rect x="0" y="0" width="56" height="48" fill="url(#hatch)" opacity=".5"/><rect x="0.5" y="0.5" width="55" height="47" fill="none" stroke="#121212"/><text x="28" y="29" class="mb" fill="#121212" font-size="9" text-anchor="middle" letter-spacing="1.2">FULL</text></svg>
