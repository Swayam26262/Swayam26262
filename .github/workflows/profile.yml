name: Profile refresh

# Rebuilds every SVG on the profile: daily for the live GitHub/LeetCode numbers
# and the snake, and whenever the generator or profile.toml changes.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC / 08:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - run: pip install -r generator/requirements.txt

      - name: Test the generator
        run: python -m unittest discover -s generator/tests

      - name: Render cards with live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generator/build.py --live

      - name: Snake eating the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#ff5c26&color_dots=#1b1b1b,#35332f,#716c63,#a8a297,#eeeae2
            assets/snake-light.svg?color_snake=#ff4d1a&color_dots=#e7e1d5,#cbc4b6,#8a8478,#57534c,#121212

      - name: Commit refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets generator/data/live.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile artwork"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
